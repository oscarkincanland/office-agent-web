<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Plan 规聚</title>
    <script>
      window.__oawNativeFileReader = window.FileReader;
      window.__oawNativeFile = window.File;
      window.__oawNativeBlob = window.Blob;
      window.__oawNativeFileList = window.FileList;
    </script>
    <script>
      // 系统"减少动效"偏好同步到 <html data-reduce-motion>，且必须在首帧前完成：
      // CSS 动效闸门因此只需要一个属性选择器，不必在样式表里重复维护两份关闭清单。
      try {
        var reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        var syncReduceMotion = function () {
          document.documentElement.dataset.reduceMotion = reduceQuery.matches ? "1" : "";
        };
        syncReduceMotion();
        if (reduceQuery.addEventListener) reduceQuery.addEventListener("change", syncReduceMotion);
        else if (reduceQuery.addListener) reduceQuery.addListener(syncReduceMotion);
      } catch (error) {}
    </script>
    <link rel="icon" href="/规聚标志.svg" />
  </head>
  <body>
    <div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;font-family:system-ui;color:#8a8fa3;background:#1a1a2e"><img width="36" height="36" src="/规聚标志.svg" alt="Open Plan" /><div>Open Plan 规聚 · 正在加载…</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
