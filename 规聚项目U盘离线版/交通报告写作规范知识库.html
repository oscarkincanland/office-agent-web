## 适用范围
城市级综合交通体系规划，包括：
- **城市综合交通规划**（最完整类型，覆盖全交通方式，如义乌2025-2035）
- **片区综合交通规划**（聚焦特定片区的交通体系，如丽水高铁新城）
- **综合交通规划说明书**（配合规划文本的详细说明文件）

## 核心依据
- 《城市综合交通体系规划编制办法》（建城〔2010〕80号）
- 《城市综合交通体系规划编制导则》（2010版，2022修订征求意见）
- 上位城市总体规划/国土空间总体规划
- 各交通子系统的行业标准及规划编制要求

## 标准章节框架

### 第一章 规划概述
- **规划背景**：城市发展需求、政策驱动（交通强国/长三角一体化/共同富裕等）、上位规划要求
- **规划依据**：国家法律法规、国标规范、上位规划（国土空间/综合交通/各交通专项）
- **规划范围与期限**：规划地域范围、年限（现状年、近期、远期、远景）
- **技术路线**：研究方法、数据来源、工作流程

### 第二章 发展现状与形势
- **城市发展概况**：
  - 地理区位与区域关系（在都市圈/城市群中的定位）
  - 社会经济发展（人口规模及分布、GDP、产业结构）
  - 城市空间结构与用地布局
  - 机动化发展（机动车保有量及增长趋势）
- **综合交通发展现状**（分方式阐述）：
  - 对外交通：公路（高速/国省道）、铁路（高铁/普速/城际）、航空、水运
  - 城市道路：路网结构（快速路/主干路/次干路/支路）、路网密度、路网形态
  - 公共交通：公交线路及场站、轨道交通（如有）、出租车/网约车
  - 慢行交通：步行和自行车设施现状
  - 静态交通：停车设施供给及管理
  - 交通管理：智能交通、信号控制、交通组织等
- **居民出行特征**：出行总量、出行方式结构、出行时空分布、平均出行距离
- **现状交通运行评价**：主要通道交通量、拥堵路段及节点、公交运行速度与准点率
- **存在问题**：各交通子系统的问题提炼（结构化问题清单）

### 第三章 发展趋势与需求预测
- **上位规划解读**：国家和省级规划对本城市交通发展的定位和要求
- **城市发展趋势**：人口增长、空间拓展、产业发展对交通的影响
- **综合交通需求预测**：
  - 出行生成预测
  - 出行分布预测
  - 方式划分预测（关键——预测未来公交/小汽车/慢行/轨道分担率）
  - 交通分配预测
- **主要通道交通量预测**：城市出入通道、跨江/跨河通道、组团联系通道

### 第四章 发展战略与目标
- **战略定位**：城市综合交通体系的功能定位和战略方向
- **发展战略**：空间引领/公交优先/区域一体/绿色低碳/智慧赋能等战略
- **发展目标体系**（必备表格，分近期/远期/远景三级目标）：
  | 指标类别 | 指标名称 | 单位 | 现状值 | 近期目标 | 远期目标 | 远景展望 |
  |---------|---------|------|-------|---------|---------|---------|
  | 设施水平 | 路网密度 | km/km² | | | | |
  | | 公交线网密度 | km/km² | | | | |
  | 服务水平 | 高峰平均车速 | km/h | | | | |
  | | 公交分担率 | % | | | | |
  | 绿色交通 | 绿色出行比例 | % | | | | |
  | 安全水平 | 万车死亡率 | 人/万车 | | | | |

### 第五章 综合交通体系规划（核心章节，分方式展开）

#### 5.1 对外交通系统规划
- **公路网规划**：高速公路网布局、国省道干线公路布局、与城市道路衔接方案
- **铁路系统规划**：高速铁路、普速铁路、城际铁路的线路走向及站场布局
- **航空系统规划**（如适用）：机场选址、集疏运体系
- **水运系统规划**（如适用）：航道等级、港口布局、集疏运通道

#### 5.2 城市道路系统规划
- **路网结构规划**：快速路→主干路→次干路→支路四级路网体系
- **路网布局方案**：城市路网总体格局（"环+放射"、"棋盘+放射"等）
- **快速路系统规划**：线位、出入口、立交节点
- **跨江/跨河、穿山通道规划**：桥梁、隧道的位置及建设时序
- **道路红线与断面**：各等级道路红线宽度、标准横断面
- **交叉口规划**：主要立交节点、道路交叉口形式

#### 5.3 公共交通系统规划
- **轨道交通规划**（如适用）：线路走向、站点布局、换乘枢纽、建设时序
- **常规公交规划**：公交线网分层（快线/干线/支线/微循环）、场站布局、专用道网络
- **公交优先措施**：路权优先、信号优先、枢纽换乘便捷化
- **辅助公交**：定制公交、社区微循环、出租车/网约车调控

#### 5.4 慢行交通系统规划
- **步行系统**：步行分区（高密度步行区/一般步行区）、步行道网络
- **自行车系统**：自行车道网络（独立路权/机非隔离）、共享单车停放
- **绿道系统**：与城市绿地系统结合的绿道网络

#### 5.5 静态交通系统规划
- **停车分区策略**：一类区（严格管控）、二类区（适度满足）、三类区（基本满足）
- **公共停车设施布局**：P+R停车场、路外公共停车场
- **建筑配建停车标准**：各类建筑配建停车位指标建议
- **智慧停车**：停车诱导、电子支付、共享停车

### 第六章 综合交通枢纽规划
- **客运枢纽体系**：枢纽分级（城市级/组团级/一般枢纽）、枢纽布局
- **主要枢纽详细规划**：枢纽功能、换乘方式、交通组织、用地控制
- **货运枢纽体系**：物流园区/物流中心/配送站点的空间布局

### 第七章 智慧交通规划
- **智慧交通发展目标**：信息化/数字化/智能化三个层次的阶段性目标
- **智慧交通系统架构**：感知层→网络层→平台层→应用层
- **重点建设内容**：交通感知设施、数据中心、智能信号控制、智慧公交、智慧停车、MaaS出行信息服务等
- **近期建设重点**：优先启动项目

### 第八章 近期建设规划
- **近期建设目标**：与城市近期发展目标衔接
- **近期重点项目清单**（必备表格）：
  | 序号 | 项目名称 | 项目类别 | 建设内容 | 投资估算(亿元) | 建设时序 | 责任单位 |
  |------|---------|---------|---------|--------------|---------|---------|
- **投资匡算**：分系统投资汇总、资金来源分析

### 第九章 规划实施保障
- **组织保障**：规划实施的领导协调机制、部门分工
- **规划衔接**：与国土空间总体规划、控制性详细规划的衔接机制
- **政策保障**：交通需求管理政策、公交优先政策、停车管理政策
- **用地保障**：交通设施用地纳入控规管控
- **资金保障**：多元化投融资机制
- **评估调整机制**：规划实施的动态评估与调整

## 片区综合交通规划（如高铁新城）特色

与城市综合交通规划相比，片区级的区别：
- **重点更聚焦**：高铁站/枢纽周边交通接驳是规划核心
- **路网密度更高**：片区内部路网重在微循环和可达性
- **慢行优先**：片区级规划更强调TOD导向下的步行和自行车环境
- **开发强度匹配**：交通供给与片区开发强度的协调分析
- **分期更精细**：分地块/分阶段实施计划

---

## 文字描述规范

### 风格要求
- **宏观与微观结合**：既有城市宏观层面的战略判断，又有具体路段的工程方案
- **全方式覆盖**：综合交通规划必须覆盖公路/铁路/航空/水运/城市道路/公交/慢行/停车/智慧交通/货运等全交通方式，不能遗漏
- **模式互动**：交通规划与城市空间结构/土地利用之间须建立双向反馈逻辑
- **传导清晰**：从"发展战略→系统规划→近期建设→实施保障"层层递进

### 预测方法规范
- 需求预测一般采用"四阶段法"（出行生成→出行分布→方式划分→交通分配），须说明模型参数标定和校核结果
- 方式划分预测须考虑多种情景（基准/政策/极限情景）
- 预测结果须与同类城市对比验证

### 图件必备清单
1. 城市区位与区域交通图
2. 现状路网结构与运行评价图
3. 综合交通需求预测分布图
4. 综合交通体系规划总图
5. 对外交通系统规划图
6. 城市道路系统规划图
7. 公共交通系统规划图
8. 慢行交通系统规划图
9. 近期建设项目分布图

### 术语统一（综合交通规划专用）
| 术语 | 定义 | 使用注意 |
|-----|------|---------|
| 道路网密度 | 建成区内道路总长/建成区面积(km/km²) | 一般按5.6-6.0推荐 |
| 公交分担率 | 公共交通出行量/全方式出行总量(%) | 不含步行 |
| 绿色出行比例 | 公交+慢行出行量/机动化出行总量(%) | 含步行/自行车/电动车 |
| 路网级配 | 快速路:主干路:次干路:支路的长度比例 | 推荐1:2:3:6~8 |

### 写作表述规范
- 不写"将有效改善""将显著提升"等无法验证的表述，改数据化表达："实施后路网密度由现状X提升到Y"
- 每个规划方案都与前面的"存在问题"形成闭环——每个问题都有对应的规划策略
- 分期建设规划须说明时序安排的理由（与城市开发时序吻合）
- 涉及多方案比选的，须列出不同方案的技术经济评价对比表

## 适用范围
交通基础设施类工程可行性研究报告（工可），包括物流枢纽、公路通道、零碳绿色交通等项目。

## 核心依据
- 发改投资规〔2023〕304号《政府投资项目可行性研究报告编写通用大纲》
- 发改投资规〔2023〕304号《企业投资项目可行性研究报告编写参考大纲》
- 对应行业标准（JTG公路系列、物流园区系列等）

## 标准章节框架

### 第一章 概述
- 项目概况：全称、建设目标、任务、地点、内容及规模（含主要产出）、建设工期、投资规模和资金来源、建设模式、主要技术经济指标、绩效目标
- 项目单位概况：项目法人基本信息（新组建的说明组建方案，政府资本金注入项目说明投资人构成及出资人代表）
- 编制依据：项目建议书/规划及其批复、国家和地方规划、产业政策、标准规范、专题研究成果
- 主要结论和建议：简述可行性研究的主要结论和建议

### 第二章 建设背景和必要性
- 建设背景：项目立项背景、前期工作进展（用地预审、规划选址等）
- 规划政策符合性：与经济社会发展规划、区域规划、专项规划、国土空间规划等的衔接性；与扩大内需、共同富裕、乡村振兴、节能减排、碳达峰碳中和等重大政策目标的符合性
- 建设必要性：从重大战略和规划、产业政策、经济社会发展等层面综合论证

### 第三章 需求分析与产出方案
- 需求分析：产品或服务需求现状调查→市场潜力分析→功能定位→近期远期目标→需求总量及结构
- 建设内容和规模：总体布局→主要建设内容及规模→建设标准（大型项目需明确分期建设安排及预留发展空间）
- 项目产出方案：正常运营年份应达到的生产或服务能力及质量标准要求

### 第四章 项目选址与要素保障
- 项目选址或选线：多方案比选→土地权属、供地方式、矿压覆、耕地和永久基本农田、生态保护红线、地灾评估
- 项目建设条件：自然环境（地形地貌、气象、水文、地质、地震、防洪等）、交通运输（铁路、公路、港口等）、公用工程（水电气热消防通信等）
- 要素保障分析：土地要素保障（国土空间规划、用地计划指标、节约集约用地论证）、资源环境要素保障（水资源、能源、碳排放强度、污染减排指标等）

### 第五章 建设方案
- 技术方案：技术目标→技术来源及实现路径→核心技术方案和指标（含专利/关键核心技术的知识产权分析）
- 设备方案：主要设备规格、数量、性能参数比选→关键设备单台技术经济论证→非标设备原理和组成→超限设备运输方案
- 工程方案：工程建设标准→总体布置→主要建（构）筑物和系统设计→外部运输→公用工程→配套设施（含土地利用、地下空间综合利用、人防、抗震、防洪、消防等）
- 用地用海征收补偿（安置）方案：征收范围、土地现状、补偿方式和标准、安置对象等
- 数字化方案：技术、设备、工程、建设管理和运维、网络数据安全保障的设计-施工-运维全过程数字化

### 标准章节框架

#### 第一章 规划概述
- 规划背景：上级政策要求（"四好农村路"建设、乡村振兴战略、共同富裕示范区等）
- 规划依据：上位规划清单（国土空间规划、综合交通规划、各省市农村公路发展政策）
- 规划范围与期限：行政区划范围，规划年限（如基准年2023年，近期2027年，远期2035年）
- 技术路线：采用的研究方法（节点连通法/GIS网络分析法等）

#### 第二章 发展现状
- **地理区位**：区域地理位置、自然条件（地形地貌、水系等）、行政分区
- **社会经济**：人口（总量/分布）、GDP、产业结构、城镇化率、旅游资源分布
- **综合交通现状**：对外运输通道、高速公路/国省干线布局、铁路/水运等
- **农村公路现状**（核心章节，须详细分析）：
  - 总体规模：总里程、技术等级分布（一级/二级/三级/四级/等外）
  - 路网结构：县道/乡道/村道的里程及比例、路面铺装率
  - 路网指标：路网密度、乡镇/建制村通达率及通畅率、乡镇通三级及以上公路比例
  - 桥梁隧道：危桥数量及比例
  - 养护情况：列养率、优良中等路率

#### 第三章 问题与需求分析
- **存在问题**：
  - 路网结构问题（县乡道占比低、技术等级偏低、网络化程度不足）
  - 覆盖联通问题（南北/东西通道不足、乡镇间联通不畅、产业节点/景区覆盖不足）
  - 安全服务水平问题（安全防护设施不足、危桥/临水临崖隐患、客运覆盖不足）
  - 管养问题（养护资金不足、养护机制不健全）
- **发展需求**：
  - 社会经济发展对农村公路的新要求（产业路/旅游路/资源路）
  - 综合交通衔接需求（与高速公路、国省干线的衔接、交通枢纽集疏运）
  - 城乡一体化发展需求（公交线路延伸、物流节点覆盖）

#### 第四章 规划思路与目标
- **指导思想**：紧扣政策导向（交通强国/乡村振兴/共同富裕/四好农村路2.0等）+ 本地发展定位
- **规划原则**：系统协调、因地制宜、融合发展、绿色安全、适度超前
- **规划目标体系**（必备表格）：
  | 序号 | 指标 | 单位 | 现状值 | 近期目标 | 远期目标 |
  |------|-----|------|-------|---------|---------|
  | 1 | 农村公路总里程 | km | | | |
  | 2 | 乡镇通三级及以上公路比例 | % | | | |
  | 3 | 建制村通双车道比例 | % | | | |
  | 4 | 优良中等路率 | % | | | |
  | 5 | 乡镇30分钟上高速比例 | % | | | |

#### 第五章 布局方案（核心章节）
- **节点分析**：将区域内所有重要节点分级（城区/乡镇/景区/产业园/交通枢纽等），分析各节点间的连通需求
- **路网规模测算**：
  - 连通度法/国土系数法/类比法等测算规划总里程
  - 与现状对比，确定新增里程和升级改造里程
- **布局思路**：路网总体格局描述（如"三纵两横一环""一轴两带三融合"等）
- **线网布局方案**：
  - 县道规划：线路编号、路线名称、起点终点、里程、技术等级、建设性质（新建/改建）
  - 乡道规划：同理
  - 村道规划：侧重连通性和通达性提升
- **重点建设项目表**（必备）：
  | 序号 | 项目名称 | 建设性质 | 起点终点 | 里程(km) | 技术等级 | 投资估算(万元) | 实施时序 |
  |------|---------|---------|---------|---------|---------|--------------|---------|

#### 第六章 效果评价
- **路网指标对比**：规划前后主要指标的变化（密度、等级结构、通达性）
- **通达性评价**：各层级节点（乡镇/建制村/景区/产业园）的到达时间缩短情况
- **社会经济效果**：对乡村振兴、产业发展、民生改善的支撑作用
- **安全服务水平**：安全防护设施提升、危桥改造、隐患治理

#### 第七章 投资估算与实施计划
- 投资估算：按项目分列（建安费+征地拆迁+其他费用），按"新建/改建/安防/危桥改造"分类汇总
- 资金筹措：上级补助+地方财政+社会资本
- 分期实施计划：近期重点（打基础/补短板）、中期推进（扩网络/提等级）、远期完善（优结构/促融合）

#### 第八章 保障措施
- 组织保障：建立领导小组/工作专班
- 制度保障：项目管理办法、质量监督机制
- 资金保障：财政投入、资金整合机制
- 用地保障：与国土空间规划衔接、用地指标
- 管养保障：养护体制改革、路长制落实

- **主要进展/成效（2-4段）**：最核心的3-5项工作，每项配定量指标。句式："一是……二是……"或"在X方面……"
- **存在的问题（1-2段）**：直接点出关键制约因素（资金/土地/体制/时序等）
- **下步打算（2-3段）**：短期内要做的具体事项、时间节点、目标
- **请求协调事项（最末）**：需要领导拍板/协调的具体事项（清晰具体，一事一议）

#### 关键技巧
- 第一页要出现全景数字（总投资、总里程、覆盖人口等），让领导快速建立量级概念
- 项目清单用"序号|项目名称|建设内容|投资额|当前进度|存在问题"表格，一目了然
- 不堆砌具体过程，不写技术细节

---

### 二、向省级部门汇报（厅长专题会/省级评审）

**篇幅**：5-10页，30分钟内讲完
**重点**：工作系统性、规划符合性、技术可行性、创新点、政策诉求

#### 标准框架
- **编制背景**：政策依据（省级文件+市级落实）、主要历程
- **工作思路**：指导思想、规划原则、技术路线
- **核心成果**：主要数据、方案要点、创新做法（用3-5个"亮点"组织）
- **编制进展情况**：已完成工作、待完成工作、时间安排
- **需要省级支持的事项**（如适用）：资金支持、政策突破、审批协调等

#### 关键技巧
- 强化与上位规划的衔接性分析，多用引述："对标《XXXX规划》提出的XX要求，我规划提出了XX指标"
- 创新亮点和推广价值是汇报重点（省级部门关注可复制的经验）
- 技术细节适度展开，但不宜过深

---

### 三、会上会材料（区政府常务会/专题会）

**篇幅**：2-3页正文 + 若干附件
**重点**：决策依据、方案对比、实施条件、风险提示

#### 标准框架
- **议题背景**：为什么上会、政策要求、前期工作情况
- **主要内容**：规划/方案的核心要点
- **需要决策的事项**：明确列出需要会议审议/决定的内容（用"一、……二、……"列出）
- **有关建议**：承办单位的建议方案

#### 附件必备
- 规划/方案简本或摘要
- 投资估算表或资金平衡表
- 对比方案表（如有多个备选）

---

### 四、年度工作总结/专题汇报

**篇幅**：5-15页（根据重要程度）
**重点**：全面性+系统性+突出亮点+正视问题

#### 标准框架
- **年度工作总体情况**：定位句+总量数据（投资/里程/客运量等）
- **主要工作及成效**（各块分述）：
  - 规划编制类：完成了哪些规划、批复情况、核心成果
  - 建设推进类：开工/完工项目数量及里程、投资完成率
  - 运营服务类：客运量、服务质量指标、群众满意度
  - 改革创新类：新模式/新技术/新机制
- **存在问题**：实事求是、找准痛点
- **下一年度工作思路**：目标+重点任务+关键举措

#### 关键技巧
- 每个板块用"标题+数据+案例"三段式
- 年度对比数据（当年vs上年、完成率vs目标）是刚需
- 典型案例1-2个深入描写，其他简要列举

---

## 通用语言风格规范

### 标题层级
\`\`\`
一、工作背景           ← 一级标题，黑体加粗
（一）政策要求         ← 二级标题，楷体
1. 国家层面           ← 三级标题，仿宋加粗
（1）上位规划         ← 四级标题，尽量不用
\`\`\`

### 段落结构
- **首句定调**：每段第一句必须是段落中心句。例如："项目前期工作加快推进。一是……二是……三是……"
- **数据要突出**：核心数字单独强调。例如："截至2025年底，全区公路总里程达1221.7公里，其中农村公路994.3公里。"
- **避免空话**：不说"加强领导、提高认识、狠抓落实"，直接说"做了什么事、取得什么效果"
- **文本的格式要注意**：少用或者尽量这种括号的形式，比如通车里程（XX公里）这样的形式
- **注意中英文的标点符号**：尽量都采用中文的标点符号

### 数据呈现规范
- 同一份材料中的数据口径保持一致（如"通车里程"和"公路总里程"不可混用）
- 投资类数据统一到"万元"或"亿元"，不可混用
- 百分比指标注明基数："占比X%（同比提高Y个百分点）"
- 所有的数据来源一定要出处，不要瞎编

### 必要附件
- 数据汇总表（重要指标列表）
- 重大项目清单（序号|名称|投资|进度|存在问题）
- 对比分析表（如有方案比选或前后对比）

### 回避用语
| 慎用 | 建议替换为 |
|-----|-----------|
| 大力加强 | 实施/推进/落实 |
| 显著提升 | 从X提升到Y（附数据） |
| 非常重视 | 列席/主持召开/批示 |
| 积极协调 | 已召开X次协调会、解决X个问题 |
| 全面完成 | 完成率达X% |
| 正在推进 | 已完成X%，预计X月完工 |

### 格式要求
- 正文：仿宋_GB2312 三号
- 一级标题：黑体 三号，不加标点
- 二级标题：楷体_GB2312 三号
- 三级标题：仿宋_GB2312 加粗
- 行间距：固定值28磅
- 页边距：上3.7cm、下3.5cm、左2.8cm、右2.6cm（公文标准）
`}
